const BADGE = {
  journal: ["b-journal", "Journal"],
  working: ["b-working", "Working paper"],
  conf: ["b-conf", "Conference"],
  chapter: ["b-chapter", "Book chapter"],
  data: ["b-data", "Data set"],
};

const THUMB = {
  journal: "JOURNAL",
  working: "WP",
  conf: "CONF",
  chapter: "CH",
  data: "DATA",
};

function fmtAuthors(authors, me) {
  return authors.map(author => (author === me ? `<span class="me">${author}</span>` : author)).join(", ");
}

function pubTemplate(pub) {
  const [badgeClass, badgeLabel] = BADGE[pub.type];
  const href = pub.links[0]?.u || "#";
  const links = pub.links
    .map(link => `<a class="pub-link" href="${link.u}" target="_blank" rel="noopener">${link.t}</a>`)
    .join("");

  return `<div class="pub">
      <div class="pub-thumb">${THUMB[pub.type] || "PUB"}<br/>${pub.year}</div>
      <div>
        <span class="pub-badge ${badgeClass}">${badgeLabel}</span>
        <div class="pub-title"><a href="${href}">${pub.title}</a></div>
        <div class="pub-authors">${fmtAuthors(pub.authors, pub.me)}</div>
        <div class="pub-venue">${pub.venue}</div>
        <div class="pub-links">${links}</div>
      </div>
    </div>`;
}

function render(filter) {
  const list = document.getElementById("pub-list");
  const items = PUBS
    .filter(pub => filter === "all" || pub.type === filter)
    .sort((a, b) => b.year - a.year);

  let html = "";
  let lastYear = null;

  items.forEach(pub => {
    if (pub.year !== lastYear) {
      html += `<div class="pub-year">${pub.year}</div>`;
      lastYear = pub.year;
    }
    html += pubTemplate(pub);
  });

  list.innerHTML = html || '<p class="muted">No publications in this category yet.</p>';
}

render("all");

document.querySelectorAll(".pub-filter").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".pub-filter").forEach(other => other.classList.remove("active"));
    button.classList.add("active");
    render(button.dataset.f);
  });
});
